spring.application.name=databasedemo
# Server address/port via DB_HOST environment variable (defaults to localhost:3306)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost:3306}/databasedemo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true